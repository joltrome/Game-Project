      <circle cx="244" cy="206" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <circle cx="38" cy="150" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <circle cx="152" cy="150" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <text x="18" y="238" fill="#aeb6c2" font-size="12">non-collinear independent targets</text>
