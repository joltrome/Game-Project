      <circle cx="130" cy="210" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <circle cx="229" cy="146" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <text x="18" y="238" fill="#aeb6c2" font-size="12">normal separation ≥120 px</text>
