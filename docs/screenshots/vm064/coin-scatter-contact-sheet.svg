      <circle cx="118" cy="210" r="12" fill="#f5c542" stroke="#fff0a8" stroke-width="2"/>
      <text x="18" y="238" fill="#aeb6c2" font-size="12">teaching-compatible grounded target</text>
    </g>
    <g transform="translate(425 110)">
      <rect width="350" height="250" rx="10" fill="#141820" stroke="#303744"/>
